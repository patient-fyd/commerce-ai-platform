name: commerce-ai-mysql

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      TZ: ${MYSQL_TIMEZONE:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=${MYSQL_CHARACTER_SET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_0900_ai_ci}
      - --default-time-zone=${MYSQL_DEFAULT_TIME_ZONE:-+08:00}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-50}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
      - --table-open-cache=${MYSQL_TABLE_OPEN_CACHE:-400}
      - --thread-cache-size=${MYSQL_THREAD_CACHE_SIZE:-8}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../source/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-768m}
    cpus: ${MYSQL_CPUS:-1.0}
    stop_grace_period: 30s

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME:-commerce_ai_mysql_data}
