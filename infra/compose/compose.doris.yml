name: commerce-ai-doris

services:
  doris:
    image: ${DORIS_IMAGE:-apache/doris:all-in-one-4.1.3}
    platform: ${DORIS_PLATFORM:-linux/arm64}
    restart: "on-failure:3"
    environment:
      TZ: ${DORIS_TIMEZONE:-Asia/Shanghai}
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD:?DORIS_ROOT_PASSWORD is required}
      # The official All-In-One entrypoint uses root from 127.0.0.1 to register BE.
      FE_CONFIG_EXTRA: skip_localhost_auth_check = true
    ports:
      - "127.0.0.1:${DORIS_QUERY_PORT:-9030}:9030"
      - "127.0.0.1:${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "127.0.0.1:${DORIS_BE_HTTP_PORT:-8040}:8040"
    volumes:
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_be_storage:/opt/apache-doris/be/storage
    healthcheck:
      test:
        - CMD
        - /opt/doris-ci/health_check.sh
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
    mem_limit: ${DORIS_MEMORY_LIMIT:-6g}
    cpus: ${DORIS_CPUS:-4.0}
    stop_grace_period: 60s

volumes:
  doris_fe_meta:
    name: ${DORIS_FE_META_VOLUME_NAME:-commerce_ai_doris_fe_meta}
  doris_be_storage:
    name: ${DORIS_BE_STORAGE_VOLUME_NAME:-commerce_ai_doris_be_storage}
